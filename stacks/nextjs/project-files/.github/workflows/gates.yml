name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node
          cache: true
          require-lockfile: true

      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test

      - if: hashFiles('DESIGN.md') != ''
        run: bash scripts/check-design.sh

      - run: pnpm run build
